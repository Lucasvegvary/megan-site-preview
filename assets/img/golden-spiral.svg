<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 618" role="img" aria-label="">
  <!-- Golden spiral: quarter-circle arcs inscribed in a subdividing golden
       rectangle (φ = 1.618). Squares: 618, 382, 236, 146, 90, 56 — the
       Fibonacci subdivision of a 1000 × 618 golden rectangle. -->
  <defs>
    <linearGradient id="gs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a87f2e"/><stop offset=".5" stop-color="#e6c878"/><stop offset="1" stop-color="#a87f2e"/>
    </linearGradient>
  </defs>
  <!-- faint golden-rectangle subdivision guides -->
  <g stroke="url(#gs)" stroke-width="1" fill="none" opacity=".28">
    <rect x="1" y="1" width="998" height="616"/>
    <line x1="618" y1="0" x2="618" y2="618"/>
    <line x1="618" y1="382" x2="1000" y2="382"/>
    <line x1="764" y1="382" x2="764" y2="618"/>
    <line x1="618" y1="472" x2="764" y2="472"/>
    <line x1="708" y1="382" x2="708" y2="472"/>
    <line x1="708" y1="438" x2="764" y2="438"/>
  </g>
  <!-- the spiral -->
  <path d="M0 618
           A618 618 0 0 1 618 0
           A382 382 0 0 1 1000 382
           A236 236 0 0 1 764 618
           A146 146 0 0 1 618 472
           A90 90 0 0 1 708 382
           A56 56 0 0 1 764 438"
        fill="none" stroke="url(#gs)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- eye of the spiral -->
  <circle cx="729" cy="410" r="2.4" fill="#fdfbf6"/>
</svg>
