<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Megan — Intuitive, Healer, Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe8f8"/><stop offset=".55" stop-color="#f6f0ea"/><stop offset="1" stop-color="#e8dff5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a87f2e"/><stop offset=".5" stop-color="#e6c878"/><stop offset="1" stop-color="#a87f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="42%">
      <stop offset="0" stop-color="#f3dd9b" stop-opacity=".7"/><stop offset="1" stop-color="#f3dd9b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="520" ry="240" fill="url(#glow)"/>

  <!-- faint guardian-angel wings of light, upper area -->
  <g stroke="#d8b65f" stroke-width="2" fill="none" stroke-linecap="round" opacity=".45">
    <path d="M560 150c-26-6-52-4-76 8M556 158c-34-6-66-2-96 12M552 166c-40-6-78-2-112 14M548 174c-34-10-66-12-98-6"/>
    <path d="M640 150c26-6 52-4 76 8M644 158c34-6 66-2 96 12M648 166c40-6 78-2 112 14M652 174c34-10 66-12 98-6"/>
  </g>
  <path d="M600 120c5 12 5 22 0 34-5-12-5-22 0-34z" fill="url(#gold)" opacity=".7"/>
  <g fill="#e6c878" opacity=".8"><circle cx="430" cy="120" r="2.4"/><circle cx="770" cy="120" r="2.4"/><circle cx="600" cy="92" r="2.8"/></g>

  <rect x="24" y="24" width="1152" height="582" rx="22" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".7"/>

  <!-- emblem -->
  <g transform="translate(600,250)">
    <g fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="-50" x2="0" y2="-34"/><line x1="0" y1="34" x2="0" y2="50"/>
      <line x1="-50" y1="0" x2="-34" y2="0"/><line x1="34" y1="0" x2="50" y2="0"/>
      <line x1="-35" y1="-35" x2="-24" y2="-24"/><line x1="24" y1="24" x2="35" y2="35"/>
      <line x1="35" y1="-35" x2="24" y2="-24"/><line x1="-24" y1="24" x2="-35" y2="35"/>
    </g>
    <circle r="28" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M0 -18c6.6 6 10 11.5 10 17 0 6.6-4 11.5-10 15.5-6-4-10-9-10-15.5 0-5.5 3.4-11 10-17z" fill="url(#gold)"/>
  </g>

  <text x="600" y="400" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="104" fill="#2c2150" font-weight="600">Megan</text>
  <text x="600" y="452" text-anchor="middle" font-family="Mulish, sans-serif" font-size="27" letter-spacing="9" fill="#7a5a1e" font-weight="800">INTUITIVE · HEALER · GUIDE</text>
  <text x="600" y="520" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="37" fill="#5b5478" font-style="italic">Guided by Spirit. Rooted in Love.</text>
  <text x="600" y="566" text-anchor="middle" font-family="Mulish, sans-serif" font-size="20" letter-spacing="4" fill="#4b3b8f" font-weight="700">Feet on the earth · eyes on the stars</text>
</svg>
